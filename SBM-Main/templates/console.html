<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="sbm-ui-token" content="{{ ui_api_token }}">
    <meta name="theme-color" content="#070b0a">
    <title>SBM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="/api/assets/support/logo.png">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
</head>
<body class="theme-verdant">
    <div id="vfx-bg"></div>
    <div class="app-layout">
        <aside id="appSidebar" class="sidebar" aria-label="Primary navigation">
            <div class="brand">
                <div class="brand-mark" aria-hidden="true"><span>S</span></div>
                <div class="brand-copy">
                    <h1 class="brand-title">SBM</h1>
                    <p class="brand-subtitle">Control center</p>
                </div>
                <button id="sidebarClose" class="sidebar-close" type="button" aria-label="Close navigation menu">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <nav class="nav-menu"></nav>
            <div class="sidebar-footer">
                <div class="sidebar-links" aria-label="SBM links">
                    <a class="sidebar-link" href="https://github.com/idkitsomuch001" target="_blank" rel="noreferrer" data-tooltip="Source code on GitHub"><img src="/api/assets/support/github.svg" alt=""><span>Public source code</span></a>
                </div>
                <div class="sidebar-status"><span class="sidebar-status-dot" aria-hidden="true"></span>Local control</div>
                <div id="sidebarVersion" class="sidebar-version">SBM</div>
            </div>
        </aside>
        <button id="sidebarBackdrop" class="sidebar-backdrop" type="button" aria-label="Close navigation menu" tabindex="-1"></button>

        <main class="main-content">
            <header class="topbar">
                <div class="topbar-title">
                    <button id="menuToggle" class="menu-toggle" type="button" aria-label="Open navigation menu" aria-controls="appSidebar" aria-expanded="false">
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                        <span aria-hidden="true"></span>
                    </button>
                    <div class="page-heading">
                        <p class="page-kicker">SBM Control</p>
                        <h2 id="pageTitle" class="page-title">Dashboard</h2>
                    </div>
                </div>

                <div class="header-actions">
                    <span class="header-status"><span class="header-status-dot" aria-hidden="true"></span>Local</span>
                    <label class="language-selector" title="Choose interface language" data-i18n-skip>
                        <select id="languageSelect" aria-label="Choose interface language">
                            <option value="en" lang="en">EN</option>
                            <option value="ru" lang="ru">RU</option>
                            <option value="ko" lang="ko">KO</option>
                            <option value="fr" lang="fr">FR</option>
                            <option value="es" lang="es">ES</option>
                        </select>
                    </label>
                </div>
            </header>
            <div id="alertStack" class="alerts-container"></div>
            <aside id="tipsBand" class="tips-band hidden" aria-label="SBM tips" aria-roledescription="carousel">
                <span class="tips-label">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M8.5 14.5a6 6 0 1 1 7 0c-1 .7-1.5 1.5-1.5 2.5h-4c0-1-.5-1.8-1.5-2.5Z"/></svg>
                    <span>Tips</span>
                </span>
                <div id="tipContent" class="tips-content" aria-live="off" aria-atomic="true"></div>
                <div class="tips-controls">
                    <button id="previousTipBtn" class="tips-arrow" type="button" aria-label="Previous tip" aria-controls="tipContent">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg>
                    </button>
                    <span id="tipCounter" class="tips-counter" data-i18n-skip></span>
                    <button id="nextTipBtn" class="tips-arrow" type="button" aria-label="Next tip" aria-controls="tipContent">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 6 6 6-6 6"/></svg>
                    </button>
                </div>
            </aside>
            <div class="views-scroll-shell">
                <div id="viewsWrapper" class="views-wrapper">
                    <section id="view-dashboard" class="view active"></section>
                    <section id="view-queue" class="view"></section>
                    <section id="view-playstyles" class="view"></section>
                    <section id="view-history" class="view"></section>
                    <section id="view-logs" class="view"></section>
                    <section id="view-settings" class="view"></section>
                </div>
                <div id="mainViewScrollbar" class="app-scrollbar main-view-scrollbar" role="scrollbar" aria-controls="viewsWrapper" aria-orientation="vertical" aria-label="Scroll current page" tabindex="0"><div id="mainViewScrollbarThumb" class="app-scrollbar-thumb"></div></div>
            </div>
            <div id="queueDock" class="queue-dock hidden"></div>
        </main>
    </div>
    <div id="tooltip" class="tooltip hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <script src="{{ url_for('static', filename='js/i18n_es_ko.js') }}"></script>
    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/panel.js') }}"></script>
</body>
</html>
